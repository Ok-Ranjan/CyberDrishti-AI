<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Result | ScamShield AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-950 text-white">

    <main class="mx-auto max-w-3xl px-6 py-16">

        <h1 class="text-3xl font-bold text-cyan-400">
            CyberDrishti AI
        </h1>

        <div class="mt-8 rounded-2xl border border-slate-800 bg-slate-900 p-6">

            <h2 class="text-xl font-semibold">
                Submission received
            </h2>

            <p class="mt-3 text-slate-400">
                Your input passed basic form validation. Scam analysis
                has not been implemented yet.
            </p>

            <h3 class="mt-6 font-medium">Submitted content</h3>

            <pre class="mt-3 whitespace-pre-wrap break-words rounded-lg bg-slate-950 p-4 text-sm text-slate-300">{{ message }}</pre>

            <a href="{% url 'scanner:home' %}"
               class="mt-6 inline-block rounded-lg bg-cyan-500 px-5 py-3 font-semibold text-slate-950">
                Scan another message
            </a>

        </div>

    </main>

</body>
</html>
