 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block meta_description %}CyberDrishti AI helps analyze suspicious messages and URLs.{% endblock %}">

    <title>{% block title %}CyberDrishti AI{% endblock %}</title>

    <script src="https://cdn.tailwindcss.com"></script>
    {% block extra_css %}{% endblock %}
</head>

<body class="min-h-screen bg-slate-950 text-white flex flex-col">

    <!-- Shared Navbar -->
    <header class="border-b border-slate-800 bg-slate-950">
        <nav class="mx-auto flex max-w-6xl items-center justify-between px-6 py-5">
            <a href="{% url 'scanner:home' %}"
               class="text-2xl font-bold text-cyan-400">
                ScamShield <span class="text-white">AI</span>
            </a>

            <div class="flex items-center gap-5 text-sm">
                <a href="{% url 'scanner:home' %}"
                   class="text-slate-300 hover:text-cyan-400">
                    Scanner
                </a>

                {% block nav_links %}{% endblock %}
            </div>
        </nav>
    </header>

    <!-- Page-specific content -->
    <main class="mx-auto w-full max-w-6xl flex-1 px-6 py-10">
        {% block content %}{% endblock %}
    </main>

    <!-- Shared Footer -->
    <footer class="border-t border-slate-800">
        <div class="mx-auto max-w-6xl px-6 py-5 text-center text-sm text-slate-500">
            <p>CyberDrishti AI — Phishing and Scam Detection Assistant</p>
            <p class="mt-1">
                Prototype only. Always verify suspicious messages independently.
            </p>
        </div>
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
