services:
  - type: web
    name: cyberdrishti-ai
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      cd CyberDrishti_Ai && python manage.py collectstatic --noinput
      cd CyberDrishti_Ai && python manage.py migrate --noinput
    startCommand: cd CyberDrishti_Ai && gunicorn CyberDrishti_Ai.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.0"
